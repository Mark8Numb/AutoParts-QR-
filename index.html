<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AutoQR — Журнал водителя</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0f1e">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(145deg, #0a0f1e 0%, #0c1222 100%);
      min-height: 100vh;
      padding: 20px;
      color: #eef3ff;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
    }

    .card {
      background: rgba(18, 25, 45, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 40px;
      padding: 24px;
      margin-bottom: 24px;
      border: 1px solid rgba(72, 187, 255, 0.2);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #fff, #5bc0ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 4px;
    }

    .sub {
      color: #8e9bb5;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .flex-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      background: #1e2a47;
      border: none;
      padding: 10px 18px;
      border-radius: 60px;
      font-size: 14px;
      font-weight: 500;
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    button.primary {
      background: #2b6ef0;
      box-shadow: 0 4px 12px rgba(43, 110, 240, 0.3);
    }

    button.primary:hover {
      background: #1e5ad6;
      transform: scale(0.97);
    }

    button.danger {
      background: #b91c1c;
    }

    button.danger:hover {
      background: #8b1515;
    }

    input, textarea, select {
      background: #0e1428;
      border: 1px solid #2a3655;
      padding: 10px 16px;
      border-radius: 60px;
      color: white;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #2b6ef0;
    }

    .detail-card {
      background: #0e1428cc;
      border-radius: 28px;
      padding: 16px;
      margin-top: 16px;
      border-left: 4px solid #2b6ef0;
      font-size: 14px;
    }

    .notes-list {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .note-item {
      background: #111827;
      border-radius: 28px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #1f2a44;
    }

    .note-item.completed {
      opacity: 0.65;
      text-decoration: line-through;
      background: #0a1020;
    }

    .note-text {
      flex: 1;
      font-size: 15px;
      word-break: break-word;
    }

    .check-btn {
      width: 28px;
      height: 28px;
      border-radius: 30px;
      background: none;
      border: 2px solid #4c6a9e;
      padding: 0;
      justify-content: center;
    }

    .mic-btn {
      background: #d43f34;
      margin-top: 8px;
    }

    .recording {
      animation: pulse 1.2s infinite;
      background: #b91c1c;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 #ff5e4a80; }
      70% { box-shadow: 0 0 0 8px #ff5e4a00; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #0e1428ee;
      border-radius: 48px;
      max-width: 700px;
      width: 92%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 24px;
      border: 1px solid #2b6ef0;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .journal-item {
      background: #111827;
      border-radius: 24px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .small-btn {
      padding: 6px 12px;
      font-size: 12px;
    }

    .history-item {
      background: #0a1020;
      border-radius: 20px;
      padding: 8px 12px;
      margin-bottom: 8px;
      font-size: 13px;
    }

    hr {
      border-color: #2a3655;
      margin: 16px 0;
    }
  </style>
</head>
<body>
<div class="container">
  <!-- QR блок -->
  <div class="card">
    <h1>🔧 AutoQR</h1>
    <div class="sub">Сканируй QR → информация о детали</div>
    <div class="flex-row">
      <button id="scanQrBtn" class="primary">📷 Сканировать QR</button>
      <button id="demoQrBtn">🔍 Демо-деталь</button>
    </div>
    <div id="partInfo"></div>
  </div>

  <!-- Заметки -->
  <div class="card">
    <div class="flex-row" style="justify-content: space-between;">
      <h3>🎙️ Заметки</h3>
      <button id="openJournalBtn" class="primary" style="background:#2b6ef0;">📓 Журнал водителя</button>
    </div>
    <div id="notesList" class="notes-list">
      <div style="text-align:center; padding:20px; color:#6c7a9e;">Нет заметок</div>
    </div>
    <button id="startVoiceBtn" class="mic-btn" style="margin-top: 16px;">🎤 Записать голосом → текст</button>
    <div class="flex-row" style="margin-top: 12px;">
      <input type="text" id="deleteWordInput" placeholder="Слово для удаления" style="flex:1;">
      <button id="deleteByWordBtn" class="danger small-btn">🗑️ Удалить по слову</button>
      <button id="fullResetBtn" class="danger small-btn">⚠️ Полный сброс</button>
    </div>
  </div>
</div>

<!-- Модалка Журнал водителя -->
<div id="journalModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>📘 Журнал водителя</h2>
      <span class="close-modal" style="font-size:32px; cursor:pointer;">&times;</span>
    </div>
    <div class="flex-row" style="justify-content: space-between; margin-bottom: 16px;">
      <select id="sortSelect">
        <option value="date_desc">📅 Новые сначала</option>
        <option value="date_asc">📅 Старые сначала</option>
        <option value="text_asc">🔤 А-Я</option>
        <option value="text_desc">🔤 Я-А</option>
        <option value="completed_first">✅ Выполненные сверху</option>
        <option value="pending_first">⏳ Невыполненные сверху</option>
      </select>
      <button id="exportDataBtn" class="primary small-btn">💾 Экспорт JSON</button>
    </div>
    <div id="fullNotesList"></div>
    <hr>
    <h4>📜 История поисков деталей</h4>
    <div id="searchHistoryList"></div>
    <button id="clearHistoryBtn" class="small-btn" style="margin-top:8px;">🧹 Очистить историю</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
