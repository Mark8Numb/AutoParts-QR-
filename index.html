<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AutoQR — Сканер и заметки</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Библиотека для сканера QR -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif;
    }

    body {
      background: #0f0f1a;
      min-height: 100vh;
      color: #ffffff;
    }

    /* Контейнер приложения */
    .app {
      max-width: 500px;
      margin: 0 auto;
      background: #1a1a2e;
      min-height: 100vh;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }

    /* Шапка */
    .header {
      background: linear-gradient(135deg, #16213e, #1a1a2e);
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #2d3561;
    }
    .header h1 {
      font-size: 24px;
      background: linear-gradient(135deg, #fff, #5bc0ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .header p {
      font-size: 12px;
      color: #8e9bb5;
      margin-top: 4px;
    }

    /* Навигация */
    .nav {
      display: flex;
      background: #16213e;
      border-bottom: 1px solid #2d3561;
    }
    .nav-btn {
      flex: 1;
      padding: 14px;
      background: none;
      border: none;
      color: #8e9bb5;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .nav-btn.active {
      color: #5bc0ff;
      border-bottom: 2px solid #5bc0ff;
      background: rgba(91, 192, 255, 0.1);
    }

    /* Контент */
    .content {
      padding: 20px;
    }
    .tab {
      display: none;
    }
    .tab.active {
      display: block;
    }

    /* Карточки */
    .card {
      background: #16213e;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid #2d3561;
    }
    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Кнопки */
    .btn {
      background: #2d3561;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary {
      background: #5bc0ff;
      color: #1a1a2e;
    }
    .btn-primary:hover {
      background: #3a9fd9;
    }
    .btn-danger {
      background: #dc2626;
    }
    .btn-danger:hover {
      background: #b91c1c;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid #2d3561;
    }

    /* Сканер */
    .scanner-container {
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    #qr-reader {
      width: 100%;
      border: none;
    }
    #qr-reader video {
      width: 100%;
      height: auto;
    }
    .scan-result {
      background: #0f0f1a;
      border-radius: 12px;
      padding: 12px;
      margin-top: 12px;
    }

    /* Список заметок */
    .notes-list {
      max-height: 400px;
      overflow-y: auto;
    }
    .note-item {
      background: #0f0f1a;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #2d3561;
    }
    .note-item.completed {
      opacity: 0.6;
      background: #0a0a12;
    }
    .note-text {
      flex: 1;
      font-size: 14px;
      word-break: break-word;
    }
    .note-date {
      font-size: 10px;
      color: #6c7a9e;
      margin-top: 4px;
    }
    .note-actions {
      display: flex;
      gap: 8px;
    }
    .icon-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
    }

    /* Микрофон */
    .mic-btn {
      width: 100%;
      justify-content: center;
      margin-top: 8px;
    }
    .mic-btn.recording {
      background: #dc2626;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    /* История */
    .history-item {
      background: #0f0f1a;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
      border-left: 3px solid #5bc0ff;
    }
    .history-code {
      font-family: monospace;
      font-size: 12px;
      color: #5bc0ff;
    }
    .history-time {
      font-size: 10px;
      color: #6c7a9e;
    }

    /* Пустые состояния */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #6c7a9e;
    }

    /* Модальное окно */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #16213e;
      border-radius: 24px;
      max-width: 350px;
      width: 90%;
      padding: 24px;
      text-align: center;
    }
    .modal-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .modal-buttons button {
      flex: 1;
    }

    /* Инпут */
    input, textarea {
      background: #0f0f1a;
      border: 1px solid #2d3561;
      padding: 12px;
      border-radius: 12px;
      color: white;
      font-size: 14px;
      width: 100%;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: #5bc0ff;
    }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>🔧 AutoQR</h1>
    <p>Сканер деталей + голосовые заметки</p>
  </div>

  <div class="nav">
    <button class="nav-btn active" data-tab="scan">📷 Сканер</button>
    <button class="nav-btn" data-tab="notes">📝 Заметки</button>
    <button class="nav-btn" data-tab="history">📜 История</button>
  </div>

  <div class="content">
    <!-- Вкладка Сканер -->
    <div id="tab-scan" class="tab active">
      <div class="card">
        <div class="card-title">📷 Сканирование QR</div>
        <div id="qr-reader" style="width:100%"></div>
        <div id="scan-result" class="scan-result" style="display:none"></div>
        <div class="flex-row" style="display: flex; gap: 12px; margin-top: 12px;">
          <button id="startScannerBtn" class="btn btn-primary">▶️ Запустить сканер</button>
          <button id="stopScannerBtn" class="btn btn-outline">⏹️ Остановить</button>
        </div>
        <button id="manualInputBtn" class="btn btn-outline" style="width:100%; margin-top:8px;">⌨️ Ввести код вручную</button>
      </div>
    </div>

    <!-- Вкладка Заметки -->
    <div id="tab-notes" class="tab">
      <div class="card">
        <div class="card-title">🎙️ Голосовые заметки</div>
        <div class="notes-list" id="notesList">
          <div class="empty-state">📭 Нет заметок</div>
        </div>
        <button id="voiceNoteBtn" class="btn btn-primary mic-btn">🎤 Записать голосом</button>
        <div class="flex-row" style="display: flex; gap: 12px; margin-top: 12px;">
          <input type="text" id="deleteWordInput" placeholder="Слово для удаления">
          <button id="deleteByWordBtn" class="btn btn-danger">Удалить</button>
        </div>
        <button id="clearAllNotesBtn" class="btn btn-outline" style="width:100%; margin-top:8px;">🗑️ Очистить все заметки</button>
      </div>
    </div>

    <!-- Вкладка История -->
    <div id="tab-history" class="tab">
      <div class="card">
        <div class="card-title">📜 История поисков</div>
        <div id="historyList">
          <div class="empty-state">📭 Нет истории</div>
        </div>
        <button id="clearHistoryBtn" class="btn btn-outline" style="width:100%;">🧹 Очистить историю</button>
        <button id="exportDataBtn" class="btn btn-primary" style="width:100%; margin-top:8px;">💾 Экспорт всех данных</button>
      </div>
    </div>
  </div>
</div>

<script>
  // ==================== БАЗА ДЕТАЛЕЙ ====================
  const partsDB = {
    "BRAKE-PAD-TOYOTA": { name: "Колодки тормозные передние", compatible: "Toyota Camry/RAV4", sku: "BPF-8821", stock: "✅ в наличии" },
    "OIL-FILTER-VW": { name: "Фильтр масляный", compatible: "VW Golf/Passat", sku: "MANN W712/92", stock: "📦 15 шт" },
    "SPARK-BOSCH": { name: "Свечи зажигания Bosch", compatible: "BMW/Mini", sku: "FR7KPP33+", stock: "🔥 48 шт" },
    "ALTERNATOR-MB": { name: "Генератор 150A", compatible: "Mercedes W204", sku: "GEN-150-MB", stock: "⏳ под заказ" },
    "AIR-FILTER": { name: "Воздушный фильтр", compatible: "Универсальный", sku: "AF-2024", stock: "✅ 32 шт" }
  };

  // ==================== ДАННЫЕ ====================
  let notes = [];        // { id, text, completed, createdAt }
  let searchHistory = []; // { qrCode, partName, timestamp }

  // ==================== ИНИЦИАЛИЗАЦИЯ ====================
  function loadData() {
    const savedNotes = localStorage.getItem("autoqr_notes");
    if (savedNotes) notes = JSON.parse(savedNotes);
    const savedHistory = localStorage.getItem("autoqr_history");
    if (savedHistory) searchHistory = JSON.parse(savedHistory);
    renderNotes();
    renderHistory();
  }

  function saveData() {
    localStorage.setItem("autoqr_notes", JSON.stringify(notes));
    localStorage.setItem("autoqr_history", JSON.stringify(searchHistory));
  }

  // ==================== ЗАМЕТКИ ====================
  function addNote(text) {
    if (!text?.trim()) return;
    notes.unshift({
      id: Date.now(),
      text: text.trim(),
      completed: false,
      createdAt: new Date().toISOString()
    });
    saveData();
    renderNotes();
  }

  function toggleNote(id) {
    const note = notes.find(n => n.id === id);
    if (note) note.completed = !note.completed;
    saveData();
    renderNotes();
  }

  function deleteNote(id) {
    notes = notes.filter(n => n.id !== id);
    saveData();
    renderNotes();
  }

  function deleteNotesByWord(word) {
    if (!word.trim()) return;
    const before = notes.length;
    notes = notes.filter(n => !n.text.toLowerCase().includes(word.toLowerCase()));
    saveData();
    renderNotes();
    if (before !== notes.length) showToast(`Удалено ${before - notes.length} заметок`);
  }

  function clearAllNotes() {
    if (confirm("Удалить все заметки?")) {
      notes = [];
      saveData();
      renderNotes();
      showToast("Все заметки удалены");
    }
  }

  function renderNotes() {
    const container = document.getElementById("notesList");
    if (!notes.length) {
      container.innerHTML = '<div class="empty-state">📭 Нет заметок</div>';
      return;
    }
    container.innerHTML = notes.map(n => `
      <div class="note-item ${n.completed ? 'completed' : ''}">
        <div style="flex:1">
          <div class="note-text">${escapeHtml(n.text)}</div>
          <div class="note-date">${formatDate(n.createdAt)}</div>
        </div>
        <div class="note-actions">
          <button class="icon-btn" onclick="toggleNote(${n.id})">${n.completed ? '🔄' : '✅'}</button>
          <button class="icon-btn" onclick="deleteNote(${n.id})">🗑️</button>
        </div>
      </div>
    `).join('');
  }

  // ==================== ИСТОРИЯ ====================
  function addToHistory(qrCode, partName) {
    searchHistory.unshift({
      qrCode: qrCode,
      partName: partName,
      timestamp: new Date().toISOString()
    });
    if (searchHistory.length > 50) searchHistory.pop();
    saveData();
    renderHistory();
  }

  function renderHistory() {
    const container = document.getElementById("historyList");
    if (!searchHistory.length) {
      container.innerHTML = '<div class="empty-state">📭 Нет истории</div>';
      return;
    }
    container.innerHTML = searchHistory.map(h => `
      <div class="history-item">
        <div><strong>${escapeHtml(h.partName)}</strong></div>
        <div class="history-code">📦 QR: ${escapeHtml(h.qrCode)}</div>
        <div class="history-time">🕐 ${formatDate(h.timestamp)}</div>
      </div>
    `).join('');
  }

  function clearHistory() {
    if (confirm("Очистить историю поисков?")) {
      searchHistory = [];
      saveData();
      renderHistory();
      showToast("История очищена");
    }
  }

  // ==================== QR СКАНЕР (РАБОТАЕТ!) ====================
  let html5QrCode = null;
  let isScanning = false;

  function startScanner() {
    if (isScanning) {
      showToast("Сканер уже работает");
      return;
    }
    
    const resultDiv = document.getElementById("scan-result");
    resultDiv.style.display = "none";
    resultDiv.innerHTML = "";
    
    html5QrCode = new Html5Qrcode("qr-reader");
    
    const config = { fps: 10, qrbox: { width: 250, height: 250 } };
    
    html5QrCode.start({ facingMode: "environment" }, config, (decodedText) => {
      // Успешное сканирование
      if (isScanning) {
        processScannedCode(decodedText);
        stopScanner();
      }
    }, (errorMessage) => {
      // Ошибки игнорируем — это нормально при сканировании
      console.log(errorMessage);
    }).then(() => {
      isScanning = true;
      showToast("Сканер запущен, наведите на QR-код");
    }).catch((err) => {
      console.error("Ошибка запуска сканера:", err);
      showToast("Ошибка доступа к камере. Проверьте разрешения.");
    });
  }

  function stopScanner() {
    if (html5QrCode && isScanning) {
      html5QrCode.stop().then(() => {
        isScanning = false;
        showToast("Сканер остановлен");
      }).catch(() => {});
    }
  }

  function processScannedCode(qrData) {
    const resultDiv = document.getElementById("scan-result");
    const part = partsDB[qrData];
    
    let html = '';
    if (part) {
      html = `
        <div style="border-left: 3px solid #10b981; padding-left: 12px;">
          <strong>🔩 ${part.name}</strong><br>
          📌 ${part.sku}<br>
          🚗 ${part.compatible}<br>
          📦 ${part.stock}
        </div>
        <button id="addNoteFromScan" class="btn btn-outline" style="margin-top:12px; width:100%;">📝 Добавить в заметки</button>
      `;
      addToHistory(qrData, part.name);
      showToast(`Найдено: ${part.name}`);
    } else {
      html = `
        <div style="border-left: 3px solid #dc2626; padding-left: 12px;">
          ⚠️ Деталь не найдена<br>
          Код: ${qrData}
        </div>
        <button id="addNoteFromScan" class="btn btn-outline" style="margin-top:12px; width:100%;">📝 Добавить код в заметки</button>
      `;
      addToHistory(qrData, "Неизвестная деталь");
    }
    
    resultDiv.innerHTML = html;
    resultDiv.style.display = "block";
    
    document.getElementById("addNoteFromScan")?.addEventListener("click", () => {
      addNote(`QR: ${qrData} - ${part ? part.name : "деталь не найдена"}`);
      showToast("Добавлено в заметки");
    });
  }

  function manualInput() {
    const code = prompt("Введите код детали:", "BRAKE-PAD-TOYOTA");
    if (code) processScannedCode(code);
  }

  // ==================== ГОЛОС ====================
  let recognition = null;
  let isRecording = false;

  function initVoice() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      const btn = document.getElementById("voiceNoteBtn");
      if (btn) {
        btn.disabled = true;
        btn.textContent = "❌ Голос не поддерживается";
      }
      return;
    }
    recognition = new SpeechRecognition();
    recognition.lang = "ru-RU";
    recognition.continuous = false;
    recognition.interimResults = false;
    
    recognition.onstart = () => {
      isRecording = true;
      const btn = document.getElementById("voiceNoteBtn");
      btn.classList.add("recording");
      btn.textContent = "🎙️ Говорите...";
    };
    
    recognition.onend = () => {
      isRecording = false;
      const btn = document.getElementById("voiceNoteBtn");
      btn.classList.remove("recording");
      btn.textContent = "🎤 Записать голосом";
    };
    
    recognition.onerror = () => {
      isRecording = false;
      const btn = document.getElementById("voiceNoteBtn");
      btn.classList.remove("recording");
      btn.textContent = "🎤 Ошибка, попробуйте снова";
      setTimeout(() => {
        if (btn.textContent === "🎤 Ошибка, попробуйте снова") {
          btn.textContent = "🎤 Записать голосом";
        }
      }, 1500);
    };
    
    recognition.onresult = (event) => {
      const text = event.results[0][0].transcript;
      if (text?.trim()) addNote(text);
    };
  }

  function startVoiceNote() {
    if (!recognition) {
      alert("Голосовой ввод не поддерживается в этом браузере");
      return;
    }
    if (isRecording) recognition.stop();
    else recognition.start();
  }

  // ==================== ЭКСПОРТ ====================
  function exportAllData() {
    const data = {
      exportDate: new Date().toISOString(),
      notes: notes,
      searchHistory: searchHistory
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.download = `autoqr_data_${new Date().toISOString().slice(0,10)}.json`;
    a.href = url;
    a.click();
    URL.revokeObjectURL(url);
    showToast("Данные экспортированы");
  }

  // ==================== ВСПОМОГАТЕЛЬНЫЕ ====================
  function escapeHtml(str) {
    return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m]));
  }

  function formatDate(dateStr) {
    const date = new Date(dateStr);
    return date.toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
  }

  function showToast(msg) {
    // Простой тост
    const toast = document.createElement('div');
    toast.textContent = msg;
    toast.style.cssText = 'position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:#333; color:white; padding:8px 16px; border-radius:20px; font-size:12px; z-index:1000;';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
  }

  // ==================== НАВИГАЦИЯ ====================
  function switchTab(tabId) {
    document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
    document.getElementById(`tab-${tabId}`).classList.add('active');
    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`.nav-btn[data-tab="${tabId}"]`).classList.add('active');
  }

  // ==================== ЗАПУСК ====================
  document.addEventListener("DOMContentLoaded", () => {
    loadData();
    initVoice();
    
    // Навигация
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });
    
    // Сканер
    document.getElementById("startScannerBtn").addEventListener("click", startScanner);
    document.getElementById("stopScannerBtn").addEventListener("click", stopScanner);
    document.getElementById("manualInputBtn").addEventListener("click", manualInput);
    
    // Заметки
    document.getElementById("voiceNoteBtn").addEventListener("click", startVoiceNote);
    document.getElementById("deleteByWordBtn").addEventListener("click", () => {
      const word = document.getElementById("deleteWordInput").value;
      deleteNotesByWord(word);
    });
    document.getElementById("clearAllNotesBtn").addEventListener("click", cl
